backend:
  name: github
  repo: TheDataAreClean/otb
  branch: main
  base_url: https://sveltia-cms-auth.thedataareclean.workers.dev

app_title: Outside the Boxplot Admin

logo:
  src: /favicon.svg
  show_in_header: true

media_folder: src/images
public_folder: /images

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: src/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, required: false, hint: "Optional — overrides the URL slug. Leave blank to use the file name, which is derived from the title. Lowercase, hyphens only." }
      - { label: Excerpt, name: excerpt, widget: text, hint: "One sentence — shown in the post list and used for OG meta." }
      - label: Category
        name: category
        widget: select
        hint: "Median: finished essays. Box: dense analysis. Whisker: recommendations and links. Outlier: rough ideas and seeds."
        options:
          - { label: Median, value: median }
          - { label: Box, value: box }
          - { label: Whisker, value: whisker }
          - { label: Outlier, value: outlier }
      - { label: Published Date, name: published_date, widget: datetime, type: date }
      - { label: Draft, name: draft, widget: boolean, default: false, required: false, hint: "Hidden from the post list, category pages, feed and sitemap. The post URL still works for preview." }
      - { label: Body, name: body, widget: markdown, hint: "Callouts, margin notes and page breaks are covered on the /reference/ page." }
