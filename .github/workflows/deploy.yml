name: Deploy theme to Ghost

on:
  push:
    branches: [main]
    paths: ['theme/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['theme/**']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npm run theme:check

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Needs repo secrets GHOST_ADMIN_API_URL (https://otb.thedataareclean.com)
      # and GHOST_ADMIN_API_KEY (Ghost Admin → Settings → Integrations → custom).
      - uses: TryGhost/action-deploy-theme@v1
        with:
          api-url: ${{ secrets.GHOST_ADMIN_API_URL }}
          api-key: ${{ secrets.GHOST_ADMIN_API_KEY }}
          theme-name: otb
          working-directory: theme
